
[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"
PLAYWRIGHT_BROWSERS_PATH = "0"


[[redirects]]
from = "buildsrc"
to = "https://github.com/nirtamir2/talks/tree/main/2024-06-27"

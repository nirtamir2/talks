name: Slidev addon CI

on:
  pull_request:
    paths:
      - ".github/workflows/slidev-addon-*.yml"
      - "2025-12-15/src/**"
      - "packages/slidev-addon-sandpack/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    paths:
      - ".github/workflows/slidev-addon-*.yml"
      - "2025-12-15/src/**"
      - "packages/slidev-addon-sandpack/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: slidev-addon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter slidev-addon-sandpack format:check

      - name: Lint
        run: pnpm --filter slidev-addon-sandpack lint

      - name: Type-check
        run: pnpm --filter slidev-addon-sandpack typecheck

      - name: Run tests
        run: pnpm --filter slidev-addon-sandpack test:run

      - name: Build standalone example
        run: pnpm --filter slidev-addon-sandpack build:example

      - name: Build migrated talk
        run: pnpm --dir 2025-12-15/src exec slidev build slides.md --out /tmp/slidev-addon-sandpack-talk

  package:
    name: Pack with React ${{ matrix.react-version }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: [18.3.1, 19.2.1]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and build an isolated consumer
        env:
          REACT_VERSION: ${{ matrix.react-version }}
        run: pnpm --filter slidev-addon-sandpack test:pack

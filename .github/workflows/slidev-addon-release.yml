name: Publish Slidev addon

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: >-
          node -e "const p=require('./packages/slidev-addon-sandpack/package.json');
          const expected='slidev-addon-sandpack-v'+p.version;
          if(process.env.GITHUB_REF_NAME!==expected){throw new Error('Expected release tag '+expected+', received '+process.env.GITHUB_REF_NAME)}"

      - name: Check formatting
        run: pnpm --filter slidev-addon-sandpack format:check

      - name: Lint
        run: pnpm --filter slidev-addon-sandpack lint

      - name: Type-check
        run: pnpm --filter slidev-addon-sandpack typecheck

      - name: Run tests
        run: pnpm --filter slidev-addon-sandpack test:run

      - name: Build standalone example
        run: pnpm --filter slidev-addon-sandpack build:example

      - name: Verify packed package in an isolated consumer
        run: pnpm --filter slidev-addon-sandpack test:pack

      - name: Publish with npm trusted publishing
        working-directory: packages/slidev-addon-sandpack
        run: npm publish
